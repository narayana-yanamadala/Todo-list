<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoFlow — To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-dot"></div>
          <span class="logo-text">DoFlow</span>
        </div>
        <span id="current-date" class="date-badge"></span>
      </div>

      <div class="header-stats">
        <div class="stat-pill">
          <span id="total-count">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-pill active-pill">
          <span id="active-count">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-pill done-pill">
          <span id="done-count">0</span>
          <span class="stat-label">Done</span>
        </div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar-track">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
        <span id="progress-label" class="progress-label">0% complete</span>
      </div>
    </header>

    <!-- Input -->
    <section class="input-section">
      <div class="input-group">
        <input type="text" id="task-input" class="task-input"
          placeholder="What needs to be done?" maxlength="120" autocomplete="off"/>
        <div class="input-row">
          <select id="priority-select" class="priority-select">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
          </select>
          <select id="category-select" class="category-select">
            <option value="general">📋 General</option>
            <option value="work">💼 Work</option>
            <option value="personal">🏠 Personal</option>
            <option value="health">💪 Health</option>
            <option value="shopping">🛒 Shopping</option>
          </select>
          <input type="date" id="due-date" class="due-date-input"/>
          <button id="add-btn" class="add-btn">+ Add task</button>
        </div>
      </div>
    </section>

    <!-- Filters -->
    <section class="filter-section">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search tasks…"/>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="active">Pending</button>
        <button class="filter-tab" data-filter="completed">Done</button>
        <button class="filter-tab" data-filter="high">🔴 High</button>
      </div>
      <select id="sort-select" class="sort-select">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="priority">By priority</option>
        <option value="alpha">A → Z</option>
        <option value="duedate">By due date</option>
      </select>
    </section>

    <!-- Task list -->
    <main class="task-list-wrap">
      <ul id="task-list" class="task-list"></ul>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">☑</div>
        <p class="empty-title">All clear!</p>
        <p class="empty-sub">Add a task above to get started.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <button id="clear-completed" class="footer-btn">Clear completed</button>
      <button id="clear-all" class="footer-btn danger-btn">Clear all</button>
    </footer>

  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-title">Edit task</div>
      <input type="text" class="modal-input" id="edit-text" maxlength="120"/>
      <div class="modal-row">
        <select id="edit-priority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <select id="edit-category">
          <option value="general">General</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
          <option value="health">Health</option>
          <option value="shopping">Shopping</option>
        </select>
        <input type="date" id="edit-due"/>
      </div>
      <div class="modal-actions">
        <button class="modal-cancel" id="modal-cancel">Cancel</button>
        <button class="modal-save" id="modal-save">Save changes</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
